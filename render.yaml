services:
  # Backend Web Service
  - type: web
    name: song-app-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    startCommand: node dist/server.js
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas URI in Render Dashboard

  # Frontend Static Site
  - type: web
    name: song-app-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: song-app-backend
          property: host
