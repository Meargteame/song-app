<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraTune — Music Library & Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root, [data-theme="dark"] {
        --bg-app: #121212;
        --bg-surface: #181818;
        --bg-surface-hover: #282828;
        --bg-card: #181818;
        --bg-card-hover: #242424;
        --bg-input: #242424;
        --border-subtle: #282828;
        --border-strong: #3e3e3e;
        --music-accent: #1db954;
        --music-accent-hover: #1ed760;
        --btn-primary-bg: #1db954;
        --btn-primary-text: #000000;
        --btn-primary-hover: #1ed760;
        --btn-secondary-bg: #282828;
        --btn-secondary-hover: #333333;
        --color-danger: #f43f5e;
        --color-danger-bg: rgba(244, 63, 94, 0.12);
        --color-danger-border: rgba(244, 63, 94, 0.3);
        --color-danger-hover: #e11d48;
        --text-primary: #ffffff;
        --text-secondary: #b3b3b3;
        --text-muted: #727272;
        --tag-bg: #282828;
        --tag-border: #333333;
        --tag-text: #d4d4d8;
        --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
        --shadow-card-hover: 0 12px 32px rgba(0, 0, 0, 0.7);
        --shadow-popover: 0 16px 40px rgba(0, 0, 0, 0.85);
        --scrollbar-track: #121212;
        --scrollbar-thumb: #333333;
        --scrollbar-thumb-hover: #555555;
        --player-bg: #181818;
        --modal-bg: #181818;
        --tab-active-bg: #282828;
        --tab-active-border: #3e3e3e;
      }

      [data-theme="light"] {
        --bg-app: #f4f4f6;
        --bg-surface: #ffffff;
        --bg-surface-hover: #f1f5f9;
        --bg-card: #ffffff;
        --bg-card-hover: #f8fafc;
        --bg-input: #f1f5f9;
        --border-subtle: #e2e8f0;
        --border-strong: #cbd5e1;
        --music-accent: #1db954;
        --music-accent-hover: #1ed760;
        --btn-primary-bg: #1db954;
        --btn-primary-text: #ffffff;
        --btn-primary-hover: #1ed760;
        --btn-secondary-bg: #f1f5f9;
        --btn-secondary-hover: #e2e8f0;
        --color-danger: #e11d48;
        --color-danger-bg: rgba(225, 29, 72, 0.08);
        --color-danger-border: rgba(225, 29, 72, 0.2);
        --color-danger-hover: #be123c;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --tag-bg: #f1f5f9;
        --tag-border: #e2e8f0;
        --tag-text: #334155;
        --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        --shadow-card-hover: 0 4px 12px 0 rgba(0, 0, 0, 0.08);
        --shadow-popover: 0 10px 30px -10px rgba(0, 0, 0, 0.12);
        --scrollbar-track: #f4f4f6;
        --scrollbar-thumb: #cbd5e1;
        --scrollbar-thumb-hover: #94a3b8;
        --player-bg: #ffffff;
        --modal-bg: #ffffff;
        --tab-active-bg: #e2e8f0;
        --tab-active-border: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-app);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      div, header, section, button, input, select, textarea {
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease, box-shadow 0.2s ease;
      }
      /* Custom modern scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
